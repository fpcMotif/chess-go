<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=EB+Garamond:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <canvas id="board"></canvas>
      <aside>
        <h1>Chess</h1>
        <p class="hint">Click a piece, then a square. Captures end in a brawl.</p>
        <fieldset class="choice">
          <legend>Opponent</legend>
          <div id="opponent" class="segmented">
            <button type="button" data-value="friend" aria-pressed="true">Friend</button>
            <button type="button" data-value="easy" aria-pressed="false">Easy</button>
            <button type="button" data-value="tricky" aria-pressed="false">Tricky</button>
            <button type="button" data-value="hard" aria-pressed="false">Hard</button>
            <button type="button" data-value="demo" aria-pressed="false">Demo</button>
          </div>
        </fieldset>
        <fieldset class="choice" id="side-choice" hidden>
          <legend>You play</legend>
          <div id="side" class="segmented">
            <button type="button" data-value="w" aria-pressed="true">White</button>
            <button type="button" data-value="b" aria-pressed="false">Black</button>
          </div>
        </fieldset>
        <div id="status">White to move.</div>
        <div id="promotion" hidden></div>
        <ol id="moves"></ol>
        <button id="reset">New game</button>
      </aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
